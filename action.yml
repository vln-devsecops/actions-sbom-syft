name: "CISA-Conformant Syft SBOM & Attestation Generator"
description: "Generates enriched CISA-compliant SBOMs, provides GitHub Attestations, and attaches to packages."

inputs:
  target:
    description: "Target directory, container image, or archive to scan"
    required: false
    default: "."
  source-name:
    description: "Component/Product name"
    required: true
  source-version:
    description: "Explicit version (overrides release-please)"
    required: false
    default: ""
  release-please-file:
    description: "Path to release-please manifest file"
    required: false
    default: ".release-please-manifest.json"
  author:
    description: "SBOM Author name"
    required: false
    default: "${{ github.repository_owner }}"
  supplier:
    description: "Organization supplier name"
    required: false
    default: ""
  generation-context:
    description: "CISA Lifecycle context (build, post-build, pre-build, source)"
    required: false
    default: "post-build"
  attest:
    description: "Sign and create a GitHub Artifact Attestation"
    required: false
    default: "true"
  attach-ghcr:
    description: "Push SBOM to GHCR via cosign (requires target to be an image reference and cosign to already be installed on PATH)"
    required: false
    default: "false"
  attach-release:
    description: "Upload SBOM asset to a GitHub Release"
    required: false
    default: "false"
  release-tag:
    description: "Target release tag for upload (required if attach-release is 'true')"
    required: false
    default: ""
  package-type:
    description: "Archive type to inject the SBOM into: none, npm, maven, nuget"
    required: false
    default: "none"
  package-file-path:
    description: "Path to local archive artifact file (required if package-type is not 'none')"
    required: false
    default: ""
  human-readable-report:
    description: "Generate a human-readable HTML report of the SBOM via CycloneDX/Sunshine and upload it as a workflow artifact"
    required: false
    default: "true"

outputs:
  sbom-path:
    description: "Absolute path to the enriched CISA sbom.json"
    value: ${{ steps.cisa-enrich.outputs.sbom-path }}
  resolved-version:
    description: "Final version string applied to the SBOM metadata"
    value: ${{ steps.version.outputs.version }}
  attestation-digest:
    description: "SHA-256 digest of the SBOM subject that was attested (empty if attest is 'false')"
    value: ${{ steps.attestation-digest.outputs.digest }}
  report-path:
    description: "Absolute path to the human-readable Sunshine HTML report (empty if human-readable-report is 'false')"
    value: ${{ steps.sunshine-report.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Validate Target
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        "${{ github.action_path }}/scripts/validate-target.sh" "$TARGET"

    - name: Resolve Application Version
      id: version
      shell: bash
      env:
        SOURCE_VERSION: ${{ inputs.source-version }}
        RELEASE_PLEASE_FILE: ${{ inputs.release-please-file }}
        TARGET: ${{ inputs.target }}
      run: |
        VER=$("${{ github.action_path }}/scripts/resolve-version.sh" \
          "$SOURCE_VERSION" \
          "$RELEASE_PLEASE_FILE" \
          "$TARGET")
        echo "version=${VER}" >> "$GITHUB_OUTPUT"

    - name: Install Syft
      shell: bash
      env:
        # Pinned to a release tag rather than "main" to avoid a floating
        # version. Note tags are weaker than a commit SHA pin (mutable
        # until the upstream repo protects them); accepted here since
        # anchore/syft's install.sh has no documented per-tag checksum to
        # verify against.
        SYFT_VERSION: v1.54.0
      run: |
        set -euo pipefail
        bin_dir="${{ github.action_path }}/.bin"
        mkdir -p "$bin_dir"
        curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
          | sh -s -- -b "$bin_dir" "$SYFT_VERSION"
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Generate Base CycloneDX SBOM
      shell: bash
      env:
        SYFT_FILE_METADATA_SELECTION: all
        TARGET: ${{ inputs.target }}
      run: |
        syft "$TARGET" -o cyclonedx-json=raw-sbom.json

    - name: Enrich Metadata for CISA Compliance
      id: cisa-enrich
      shell: bash
      env:
        SOURCE_NAME: ${{ inputs.source-name }}
        RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        AUTHOR: ${{ inputs.author }}
        SUPPLIER: ${{ inputs.supplier }}
        GENERATION_CONTEXT: ${{ inputs.generation-context }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/scripts/enrich-cisa.sh" \
          --input raw-sbom.json \
          --output sbom.json \
          --name "$SOURCE_NAME" \
          --version "$RESOLVED_VERSION" \
          --author "$AUTHOR" \
          --supplier "$SUPPLIER" \
          --context "$GENERATION_CONTEXT"
        echo "sbom-path=$(pwd)/sbom.json" >> "$GITHUB_OUTPUT"

    - name: Install Sunshine
      if: inputs.human-readable-report == 'true'
      shell: bash
      env:
        # CycloneDX/Sunshine has no tagged releases to pin to, unlike this
        # repo's own `uses:` dependencies, so it's pinned to a specific
        # commit SHA instead (the strongest pin available, not a floating
        # "main"). Fetched into the action's own .bin dir, never into the
        # caller's workspace.
        SUNSHINE_COMMIT: beaab3faf2bab234069a8677fc627de2f0f01a3d
      run: |
        "${{ github.action_path }}/scripts/install-sunshine.sh" \
          "${{ github.action_path }}/.bin" \
          "$SUNSHINE_COMMIT"

    - name: Generate Human-Readable SBOM Report
      id: sunshine-report
      if: inputs.human-readable-report == 'true'
      shell: bash
      env:
        SBOM_PATH: ${{ steps.cisa-enrich.outputs.sbom-path }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/scripts/generate-sunshine-report.sh" \
          "${{ github.action_path }}/.bin" \
          "$SBOM_PATH" \
          sbom-report.html
        echo "report-path=$(pwd)/sbom-report.html" >> "$GITHUB_OUTPUT"

    - name: Upload Human-Readable SBOM Report
      if: inputs.human-readable-report == 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: sbom-report
        path: ${{ steps.sunshine-report.outputs.report-path }}

    - name: Attest SBOM (GitHub Sigstore Attestation)
      if: inputs.attest == 'true'
      uses: actions/attest-sbom@v4.1.0
      with:
        subject-path: ${{ steps.cisa-enrich.outputs.sbom-path }}
        sbom-path: ${{ steps.cisa-enrich.outputs.sbom-path }}

    - name: Compute Attestation Digest
      id: attestation-digest
      if: inputs.attest == 'true'
      shell: bash
      env:
        SBOM_PATH: ${{ steps.cisa-enrich.outputs.sbom-path }}
      run: |
        set -euo pipefail
        digest=$(sha256sum "$SBOM_PATH" | cut -d' ' -f1)
        echo "digest=sha256:${digest}" >> "$GITHUB_OUTPUT"

    - name: Attach to OCI Image in GHCR
      if: inputs.attach-ghcr == 'true'
      shell: bash
      env:
        SBOM_PATH: ${{ steps.cisa-enrich.outputs.sbom-path }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        cosign attach sbom --sbom "$SBOM_PATH" "$TARGET"

    - name: Attach to GitHub Release
      if: inputs.attach-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        SBOM_PATH: ${{ steps.cisa-enrich.outputs.sbom-path }}
      run: |
        set -euo pipefail
        if [ -z "$RELEASE_TAG" ]; then
          echo "Error: release-tag is required when attach-release is 'true'." >&2
          exit 1
        fi
        gh release upload "$RELEASE_TAG" "${SBOM_PATH}#cisa-sbom.json" --clobber

    - name: Embed SBOM in Package Payload
      if: inputs.package-type != 'none'
      shell: bash
      env:
        PACKAGE_TYPE: ${{ inputs.package-type }}
        PACKAGE_FILE_PATH: ${{ inputs.package-file-path }}
        SBOM_PATH: ${{ steps.cisa-enrich.outputs.sbom-path }}
      run: |
        "${{ github.action_path }}/scripts/attach-package.sh" \
          "$PACKAGE_TYPE" \
          "$PACKAGE_FILE_PATH" \
          "$SBOM_PATH"
