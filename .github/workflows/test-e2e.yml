name: BDD Acceptance

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats jq zip

      - name: Run BDD acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/bdd/*.bats)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No BDD acceptance tests yet."
            exit 0
          fi
          bats tests/bdd/*.bats
